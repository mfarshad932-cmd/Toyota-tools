:root{
  /* surfaces */
  --obsidian:#0E1116; --graphite:#181D25; --slate:#2A313B;
  --porcelain:#F4F5F7; --card:#FFFFFF;
  /* accent — brass, used sparingly */
  --brass:#C8A45C; --brass-soft:#E8D9B4; --brass-tint:#FBF6EA;
  /* text */
  --ink:#0E1116; --ink2:#68727F; --ink3:#9AA3AE;
  /* lines */
  --line:#E7E9ED; --line2:#D5D9DF; --hair:#EDEFF2;
  /* legacy names kept so nothing breaks */
  --bg:var(--porcelain); --brand:var(--obsidian); --brand2:var(--graphite);
  --red:#A8352A; --redbg:#FBEDEB; --amber:#8A6414; --amberbg:#FBF3E2;
  --green:#1E6047; --greenbg:#E9F2EE; --blue:#1B4B7A; --bluebg:#EAF0F6;
  --radius:16px;
  --shadow:0 1px 1px rgba(14,17,22,.04),0 4px 14px rgba(14,17,22,.055);
  --shadow-lg:0 2px 4px rgba(14,17,22,.05),0 14px 40px rgba(14,17,22,.10);
  --sans:'Archivo',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:var(--sans);background:var(--porcelain);color:var(--ink);
  font-size:15px;line-height:1.5;padding-bottom:48px;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{background:var(--obsidian);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:13px;
  position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(200,164,92,.28)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--brass) 22%,var(--brass) 78%,transparent)}
.top .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#fff,#E9EBEF);
  color:var(--obsidian);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.06em;flex:none}
.top h1{font-size:16.5px;margin:0;font-weight:700;letter-spacing:-.015em}
.top .sub{font-size:11.5px;opacity:.62;margin-top:1px;letter-spacing:.02em}
.top .role{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.07);border:1px solid rgba(200,164,92,.34);color:var(--brass-soft);
  padding:7px 12px;border-radius:8px;transition:background .15s}
.top .role:active{background:rgba(200,164,92,.16)}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px}

/* ---------- role picker ---------- */
.pick{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:26px}
.pick .box{width:100%;max-width:430px;text-align:center}
.pick h2{font-size:27px;margin:0 0 5px;font-weight:700;letter-spacing:-.03em}
.rolebtn{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:19px 20px;margin-bottom:13px;text-align:left;display:flex;align-items:center;gap:16px;
  box-shadow:var(--shadow);transition:transform .14s ease,box-shadow .14s ease,border-color .14s}
.rolebtn:active{transform:scale(.988);box-shadow:var(--shadow-lg);border-color:var(--brass)}
.rolebtn .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.ic.tech{background:var(--bluebg);border:1px solid #DCE6F0}
.ic.store{background:var(--obsidian);color:var(--brass);border:1px solid var(--slate)}
.rolebtn .t{font-size:16.5px;font-weight:650;letter-spacing:-.01em;display:block}
.rolebtn .d{font-size:12.5px;color:var(--ink2);margin-top:3px;display:block;line-height:1.4}
.rolebtn .ar{margin-left:auto;color:var(--ink3);font-size:19px}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);text-align:center;margin:0 0 12px}
.brandfoot{text-align:center;color:var(--ink3);font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:20px}

/* ---------- cards & forms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 15px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--ink2)}
label.f{display:block;font-size:10.5px;font-weight:700;color:var(--ink2);margin:0 0 7px;
  text-transform:uppercase;letter-spacing:.13em}
select.big,input.big{width:100%;padding:14px 14px;border:1px solid var(--line2);border-radius:11px;
  background:#fff;color:var(--ink);margin-bottom:16px;appearance:none;transition:border-color .15s,box-shadow .15s}
select.big:focus,input.big:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px rgba(14,17,22,.06)}
.selwrap{position:relative}
.selwrap::after{content:"▾";position:absolute;right:15px;top:14px;color:var(--ink2);pointer-events:none;font-size:13px}
textarea.big{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:11px;font-size:15px;
  min-height:76px;resize:vertical;margin-bottom:15px;font-family:inherit;line-height:1.5}
textarea.big:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px rgba(14,17,22,.06)}

/* ---------- buttons ---------- */
.btn{width:100%;padding:16px;border-radius:12px;font-size:15px;font-weight:650;letter-spacing:-.005em;
  transition:transform .12s ease,opacity .15s}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--obsidian);color:#fff;box-shadow:0 2px 10px rgba(14,17,22,.18)}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}
.btn:disabled{opacity:.38}
.btn.sm{width:auto;padding:10px 16px;font-size:13.5px;border-radius:10px}
.back{background:none;color:var(--ink2);font-size:13px;padding:4px 0 8px;margin-bottom:2px;font-weight:600;letter-spacing:.01em}

/* ---------- identity card (signature) ---------- */
.idcard{background:linear-gradient(158deg,var(--graphite),var(--obsidian));color:#fff;
  border-radius:var(--radius);padding:22px;margin-bottom:16px;position:relative;overflow:hidden;
  border:1px solid var(--slate);box-shadow:var(--shadow-lg)}
.idcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.idcard .nm{font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.idcard .meta{opacity:.66;font-size:12.5px;margin-top:6px;font-family:var(--mono);letter-spacing:.02em}
.idcard .badge{display:inline-block;background:rgba(200,164,92,.13);border:1px solid rgba(200,164,92,.36);
  color:var(--brass-soft);padding:5px 11px;border-radius:7px;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;margin:14px 0 0}

/* ---------- scanner ---------- */
#reader{width:100%;border-radius:var(--radius);overflow:hidden;background:#000;margin-bottom:15px;min-height:240px;
  border:1px solid var(--slate)}
.scanhint{border:1px dashed var(--line2);border-radius:var(--radius);padding:24px;text-align:center;background:#fff;margin-bottom:15px}
.scanhint .qic{font-size:27px;opacity:.5}
.scanhint .t{font-weight:650;margin-top:8px;font-size:14.5px}
.scanhint .d{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.45}

/* ---------- tool rows ---------- */
.searchbar{display:flex;gap:9px;margin-bottom:13px}.searchbar input{flex:1;margin:0}
.toolrow{display:flex;align-items:flex-start;gap:13px;padding:15px 4px;border-bottom:1px solid var(--hair);transition:background .12s}
.toolrow:last-child{border-bottom:none}
.toolrow:active{background:var(--porcelain)}
.toolrow .id{font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--ink2);
  width:60px;flex:none;padding-top:2px;letter-spacing:.02em}
.toolrow .nm{flex:1;font-size:14.5px;font-weight:550;letter-spacing:-.008em;line-height:1.35}
.toolrow .nm small{display:block;color:var(--ink2);font-size:11.5px;font-family:var(--mono);
  margin-top:4px;font-weight:400;letter-spacing:.01em;line-height:1.45}
.toolrow .go{color:var(--ink3);font-size:17px;padding-top:2px}

/* ---------- badges ---------- */
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:6px;
  letter-spacing:.1em;text-transform:uppercase;margin-left:7px;vertical-align:1px;white-space:nowrap}
.badge.set{background:var(--bluebg);color:var(--blue);border:1px solid #DCE6F0}
.badge.out{background:var(--redbg);color:var(--red);border:1px solid #F2DCD8}
.badge.instore{background:var(--greenbg);color:var(--green);border:1px solid #D8E7E0}
.badge.pend{background:var(--amberbg);color:var(--amber);border:1px solid #EFE2C6}

/* ---------- detail ---------- */
.detail .tid{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:.06em}
.detail .tname{font-size:22px;font-weight:700;margin:5px 0 5px;letter-spacing:-.028em;line-height:1.2}
.detail .meta{font-size:12.5px;color:var(--ink2);font-family:var(--mono);letter-spacing:.01em}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2);font-size:12.5px;flex:none}
.kv .v{font-weight:600;text-align:right;letter-spacing:-.005em}

/* ---------- alerts ---------- */
.alert{border-radius:12px;padding:14px 15px;font-size:13.5px;margin-bottom:15px;line-height:1.5;border:1px solid transparent}
.alert.warn{background:var(--amberbg);color:#6B4E10;border-color:#EFE2C6}
.alert.info{background:var(--bluebg);color:#153C61;border-color:#DCE6F0}
.alert.red{background:var(--redbg);color:#7E2A21;border-color:#F2DCD8}
.alert.green{background:var(--greenbg);color:#164B38;border-color:#D8E7E0}

/* ---------- condition grades ---------- */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:8px}
.grade{border:1px solid var(--line2);border-radius:12px;padding:13px 5px;text-align:center;
  font-weight:700;font-size:16px;background:#fff;font-family:var(--mono);transition:all .14s}
.grade small{display:block;font-size:9px;font-weight:700;color:var(--ink2);margin-top:4px;
  text-transform:uppercase;letter-spacing:.09em;font-family:var(--sans)}
.grade.sel[data-g="A"]{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.grade.sel[data-g="A"] small{color:var(--green)}
.grade.sel[data-g="B"]{border-color:var(--amber);background:var(--amberbg);color:var(--amber)}
.grade.sel[data-g="B"] small{color:var(--amber)}
.grade.sel[data-g="C"]{border-color:var(--red);background:var(--redbg);color:var(--red)}
.grade.sel[data-g="C"] small{color:var(--red)}
.grade.sel[data-g="D"]{border-color:var(--red);background:var(--red);color:#fff}
.grade.sel[data-g="D"] small{color:rgba(255,255,255,.8)}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair)}
.setrow:last-child{border-bottom:none}
.setrow input{width:19px;height:19px;accent-color:var(--obsidian)}
.setrow label{font-size:14.5px;font-family:var(--mono)}

/* ---------- dashboard stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 13px;
  box-shadow:var(--shadow);transition:transform .13s,border-color .13s}
.stat .n{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:9.5px;color:var(--ink2);margin-top:7px;text-transform:uppercase;letter-spacing:.13em;font-weight:700}
.stat.red .n{color:var(--red)}.stat.amber .n{color:var(--amber)}
.stat.green .n{color:var(--green)}.stat.blue .n{color:var(--blue)}
.stat.tap{cursor:pointer}.stat.tap:active{transform:scale(.97);border-color:var(--line2)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;margin-bottom:15px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:9px;font-size:12.5px;font-weight:650;background:#fff;
  border:1px solid var(--line);color:var(--ink2);white-space:nowrap;letter-spacing:-.005em;transition:all .14s}
.tab.on{background:var(--obsidian);color:#fff;border-color:var(--obsidian)}
.tab .c{margin-left:6px;font-family:var(--mono);font-size:11px;opacity:.65;font-weight:500}
.tab.on .c{color:var(--brass);opacity:1}

/* ---------- records ---------- */
.rec{padding:15px 3px;border-bottom:1px solid var(--hair)}
.rec:last-child{border-bottom:none}
.rec .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rec .rid{font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--ink2);letter-spacing:.02em}
.rec .rname{flex:1;font-weight:600;font-size:14.5px;letter-spacing:-.01em;min-width:120px}
.rec .sub{font-size:12px;color:var(--ink2);margin-top:5px;font-family:var(--mono);line-height:1.5;letter-spacing:.005em}
.rec .row2{display:flex;justify-content:flex-end;margin-top:11px;gap:9px}
.empty{text-align:center;color:var(--ink2);padding:46px 20px;font-size:13.5px}
.empty .big{font-size:30px;margin-bottom:10px;opacity:.4}

/* ---------- pin pad ---------- */
.pinpad{max-width:290px;margin:42px auto;text-align:center}
.pindots{display:flex;justify-content:center;gap:15px;margin:24px 0 30px}
.pindot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);transition:all .07s}
.pindot.on{background:var(--obsidian);border-color:var(--obsidian);transform:scale(1.12)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.key{padding:19px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;
  font-weight:500;font-family:var(--mono);box-shadow:var(--shadow);transition:transform .04s,background .04s;touch-action:manipulation}
.key:active{background:var(--porcelain);transform:scale(.95)}
.key.blank{background:none;border:none;box-shadow:none;pointer-events:none}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(90px);
  background:var(--obsidian);color:#fff;padding:14px 22px;border-radius:11px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 34px rgba(14,17,22,.34);z-index:60;max-width:88%;
  transition:transform .3s cubic-bezier(.2,.9,.25,1);border:1px solid var(--slate)}
.toast.show{transform:translateX(-50%) translateY(0)}
.muted{color:var(--ink2);font-size:12.5px}
.center{text-align:center}
.offline{background:var(--brass-tint);color:#6B5216;text-align:center;font-size:11.5px;padding:9px 14px;
  border-bottom:1px solid rgba(200,164,92,.3);font-weight:500}

/* dark veil so the logos and text stay crisp on top of the facets */
.brand > .veil{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg, rgba(6,8,12,.58) 0%, rgba(6,8,12,.64) 50%, rgba(6,8,12,.72) 100%)}
.brand::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brass) 20%,var(--brass-soft) 50%,var(--brass) 80%,transparent)}
.brand-row{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;z-index:2}
.logo3d{filter:drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 4px 8px rgba(0,0,0,.55)) drop-shadow(0 10px 22px rgba(225,10,26,.22));transform:translateZ(0)}
.logo-toyota{height:34px}.logo-alsayer{height:56px}
.divider{width:1px;height:46px;background:linear-gradient(180deg,transparent,rgba(200,164,92,.5),transparent)}
.brand-title{position:relative;z-index:2;text-align:center;margin-top:18px}
.brand-title .t{font-size:20px;font-weight:800;letter-spacing:.02em;line-height:1.1;color:#fff;
  text-shadow:0 1px 0 rgba(255,255,255,.12), 0 3px 10px rgba(0,0,0,.6);
  background:linear-gradient(180deg,#ffffff,#c9ced6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-title .s{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--brass-soft);margin-top:7px;padding-left:.42em}
.brand-title .loc{display:inline-block;margin-top:11px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brass);border:1px solid rgba(200,164,92,.4);padding:5px 13px;border-radius:20px;background:rgba(200,164,92,.06)}
/* stat bar */
/* ===== INTRO ===== */
#intro{position:fixed;inset:0;z-index:1000;background:#000;display:none}
/* fallback sizes so logos can NEVER render at raw size if JS fails */
.fly{width:120px;height:120px}
#flyT{width:330px;height:54px}
.fly{position:fixed;z-index:1001;pointer-events:none;will-change:left,top,width,height}
.fly img{display:block;width:100%;height:100%;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 4px 8px rgba(0,0,0,.55)) drop-shadow(0 10px 22px rgba(225,10,26,.22))}
.shine{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;opacity:.9;
  background:linear-gradient(115deg,transparent 30%,rgba(255,190,90,0) 42%,rgba(255,225,150,.95) 50%,rgba(255,120,40,.6) 56%,transparent 66%);
  background-size:280% 100%;background-position:180% 0}
#snap{position:fixed;z-index:1000;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,240,205,.8),rgba(255,180,90,.22) 45%,transparent 70%)}
@keyframes snapflash{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
.introskip{position:absolute;bottom:24px;right:20px;z-index:1002;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.2);padding:8px 15px;border-radius:20px;opacity:0;transition:opacity .5s}
.introskip.show{opacity:1}


/* action banner: TAKE vs RETURN */
.actban{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding:9px 12px;border-radius:10px;
  font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-family:var(--sans)}
.actban .ar{font-size:16px;line-height:1}
.actban.take{background:var(--amberbg);color:#6B4E10;border:1px solid #EFE2C6}
.actban.ret{background:var(--greenbg);color:#164B38;border:1px solid #D8E7E0}
.actban .sm2{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px;opacity:.85;margin-left:auto}


.top .role{display:flex;align-items:center;gap:6px}
.top .role .hico{font-size:16px;line-height:1;margin-top:-2px}
.top .role .hlbl{font-size:10.5px;font-weight:700;letter-spacing:.1em}

/* iPhone safe areas + iOS rendering safety */
.brand{padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
.top{padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
body{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
@supports not (mix-blend-mode:screen){.shine{display:none}}
.fly img,.logo3d{-webkit-transform:translateZ(0);transform:translateZ(0)}

/* lock light appearance everywhere (Samsung Internet / Chrome auto-dark) */
:root{color-scheme:light only}
html{color-scheme:light only;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--porcelain)!important;color:var(--ink)!important}
.card,.rolebtn,.stat,.statline,.key,.tab{background:#fff!important}
.top,.brand{background-color:var(--obsidian)!important}
@media (prefers-color-scheme:dark){
  body{background:var(--porcelain)!important;color:var(--ink)!important}
  .card,.rolebtn,.stat,.statline,.key,.tab{background:#fff!important;color:var(--ink)!important}
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== PASTE YOUR FREE FIREBASE KEYS HERE (see SETUP.md) =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// =============================================================

let db=null, FB_OK=false;
try{
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);
  FB_OK = firebaseConfig.apiKey!=="YOUR_API_KEY";
}catch(e){ console.warn('Firebase init failed',e); }

// expose a tiny API the rest of the app calls
window.DB = {
  ok: FB_OK,
  async add(rec){ if(!FB_OK)return _localAdd(rec); const r=await addDoc(collection(db,'log'),rec); return r.id; },
  async update(id,patch){ if(!FB_OK)return _localUpdate(id,patch); await updateDoc(doc(db,'log',id),patch); },
  watch(cb){
    if(!FB_OK){ _localWatch(cb); return; }
    onSnapshot(query(collection(db,'log'),orderBy('out','desc')),snap=>{
      const rows=[]; snap.forEach(d=>rows.push({id:d.id,...d.data()})); cb(rows);
    });
  },
  async clear(){
    if(!FB_OK){ _localClear(); return; }
    const snap=await getDocs(collection(db,'log'));
    const jobs=[]; snap.forEach(d=>jobs.push(deleteDoc(doc(db,'log',d.id))));
    await Promise.all(jobs);
  }
};

// ---- local fallback so the file also works offline for testing ----
function _lget(){try{return JSON.parse(localStorage.getItem('toolcrib')||'[]');}catch(e){return [];}}
function _lset(a){localStorage.setItem('toolcrib',JSON.stringify(a));_lcbs.forEach(cb=>cb(a.slice().sort((x,y)=>(y.out||'').localeCompare(x.out||''))));}
let _lcbs=[];
function _localAdd(rec){const a=_lget();const id='L'+Date.now()+Math.random().toString(36).slice(2,6);a.push({id,...rec});_lset(a);return id;}
function _localUpdate(id,patch){const a=_lget();const i=a.findIndex(r=>r.id===id);if(i>=0){Object.assign(a[i],patch);_lset(a);}}
function _localWatch(cb){_lcbs.push(cb);cb(_lget().slice().sort((x,y)=>(y.out||'').localeCompare(x.out||'')));}
function _localClear(){_lset([]);}
window.addEventListener('storage',()=>{_lcbs.forEach(cb=>cb(_lget()));});
</script>

/* ---- boot ---- */
// Safety: if the Firebase module didn't load (offline/file://), build a local DB now.
if(!window.DB){
  const _lget=()=>{try{return JSON.parse(localStorage.getItem('toolcrib')||'[]');}catch(e){return [];}};
  let _cbs=[];
  const _fire=()=>{const a=_lget().slice().sort((x,y)=>((y.out||y.at||'')+'').localeCompare((x.out||x.at||'')+''));_cbs.forEach(cb=>cb(a));};
  window.DB={ok:false,
    async add(rec){const a=_lget();const id='L'+Date.now()+Math.random().toString(36).slice(2,6);a.push({id,...rec});localStorage.setItem('toolcrib',JSON.stringify(a));_fire();return id;},
    async update(id,patch){const a=_lget();const i=a.findIndex(r=>r.id===id);if(i>=0){Object.assign(a[i],patch);localStorage.setItem('toolcrib',JSON.stringify(a));_fire();}},

window.addEventListener('DOMContentLoaded',()=>{ bootWhenReady(0); });
function ensureLocalDB(){
  if(window.DB) return;
  const _lget=()=>{try{return JSON.parse(localStorage.getItem('toolcrib')||'[]');}catch(e){return [];}};
  let _cbs=[];
  const _fire=()=>{const a=_lget().slice().sort((x,y)=>((y.out||y.at||'')+'').localeCompare((x.out||x.at||'')+''));_cbs.forEach(cb=>cb(a));};
  window.DB={ok:false,
    async add(rec){const a=_lget();const id='L'+Date.now()+Math.random().toString(36).slice(2,6);a.push({id,...rec});localStorage.setItem('toolcrib',JSON.stringify(a));_fire();return id;},
    async update(id,patch){const a=_lget();const i=a.findIndex(r=>r.id===id);if(i>=0){Object.assign(a[i],patch);localStorage.setItem('toolcrib',JSON.stringify(a));_fire();}},
    watch(cb){_cbs.push(cb);_fire();},
    async clear(){localStorage.setItem('toolcrib','[]');_fire();}
  };
  window.addEventListener('storage',_fire);
}
function bootWhenReady(tries){
  // give the Firebase module a brief moment; if not present, use local DB
  if(!window.DB && tries<8){ return setTimeout(()=>bootWhenReady(tries+1),120); }
  ensureLocalDB();
  runBoot();
}
function runBoot(){
  if(!window.DB || !window.DB.ok) $('offlineBar').classList.remove('hidden');
  window.DB.watch(rows=>{ LOG=rows; if(ROLE==='store' && curStoreView) curStoreView(); if(ROLE==='tech' && GATE) techToolList(); });
  // ---- ROUTING ----
  // Store keeper secret link: ?s=1  -> he sees the role page (only he ever sees it)
  if(isStoreLink()){ STORE_LINK=true; showPick(); return; }
  // Technician personal link: ?t=<techId>  (also ?T=, ?id=, #t=, stray spaces)
  const raw = readLinkId();
  if(raw){
    const tech = findTech(raw);
    if(tech){
      MY_LINK = raw;
      ID_METHOD = 'link';
      ME={sec:tech[0],id:tech[1],name:tech[2]};
      ROLE='tech'; showApp('Technician'); techGate(); return;
    }
    ROLE='tech'; showApp('Technician'); badLink(raw); return;
  }
  // No link at all -> ask for his personal link. No role buttons are shown.
  ROLE='tech'; showApp('Technician'); needLink();
}
let STORE_LINK=false;
function showPick(){ stopScanner(); $('app').classList.add('hidden'); $('pick').classList.remove('hidden'); ROLE=null; ME=null; GATE=false; curStoreView=null; window.scrollTo(0,0); }
function isStoreLink(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('s')||q.get('S')) return true;
    return /[#&]s=/i.test(location.hash||'');
  }catch(e){ return false; }
}
function needLink(){
  setTitle('Personal link needed','Use your own QR or ID');
  $('view').innerHTML=`<div class="card center">

}
let MY_LINK=null;
function readLinkId(){
  try{
    const q=new URLSearchParams(location.search);
    let v=q.get('t')||q.get('T')||q.get('id');
    if(!v && location.hash){ const m=location.hash.match(/[#&]t=([^&]+)/i); if(m) v=m[1]; }
    return v ? String(v).trim() : null;
  }catch(e){ return null; }
}
function findTech(id){
  const v=String(id).trim().toLowerCase();

}
function badLink(raw){

}

function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600);}
function showApp(role){$('pick').classList.add('hidden');$('app').classList.remove('hidden');

function setTitle(t,s){$('topTitle').textContent=t;$('topSub').textContent=s||'Toyota Workshop';}
function home(){
  stopScanner(); GATE=false; curStoreView=null;
  if(STORE_LINK){ pinBuf=''; showPick(); return; }        // store keeper -> back to the role page
  const t = MY_LINK ? findTech(MY_LINK) : null;
  ROLE='tech'; ME=null;
  if(t){ ID_METHOD='link'; ME={sec:t[0],id:t[1],name:t[2]}; techGate(); }  // his link -> cabin scan
  else needLink();

function go(where){
  if(where==='tech'){ ROLE='tech'; showApp('Technician'); techPickSelf(); }
  else { ROLE='store'; showApp('Store Keeper'); pinBuf=''; pinScreen(); }

function fmtTime(iso){if(!iso)return '—';const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function ago(iso){const ms=Date.now()-new Date(iso).getTime();const h=Math.floor(ms/3.6e6),m=Math.floor(ms/6e4)%60;return h>0?h+'h '+m+'m':m+'m';}
const OVERDUE_H=8;
function isOverdue(m){return m.status==='OUT'&&(Date.now()-new Date(m.out).getTime())>OVERDUE_H*3.6e6;}
function isToday(iso){if(!iso)return false;const d=new Date(iso),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function openMove(tid){for(let i=0;i<LOG.length;i++){if(LOG[i].tid===tid&&LOG[i].status!=='IN')return LOG[i];}return null;}
function toolStatus(tid){const m=openMove(tid);return m?m.status:'IN';}

/* ================= TECHNICIAN ================= */
// Identity is proved in ONE of two ways:
//   1. Scanning his own personal QR sticker  (best - nothing to guess)
//   2. Typing his own ID number, then confirming his name on screen
// The old name/section dropdown is NEVER coming back - it let anyone pick another man's name.
// How the identity was proved is stored on every record (idBy: 'scan' or 'typed')
// so the store keeper can see it at hand-over.
let ID_METHOD='link';

function techPickSelf(){
  setTitle('Who are you?','Prove your identity');
  $('view').innerHTML=`<div class="card">
    <h3>Identify yourself</h3>
    <p class="muted" style="margin:0 0 16px;line-height:1.6">Use your own technician QR sticker, or type your own ID number.</p>
    <button class="btn primary" onclick="scanSelf()">&#128247; &nbsp;Scan my personal QR</button>
    <div class="center muted" style="margin:14px 0 12px;font-size:11px;letter-spacing:.14em">— OR —</div>
    <label class="f">My ID number</label>
    <input class="big" id="myid" type="tel" inputmode="numeric" autocomplete="off" placeholder="e.g. 2205786" oninput="idCheck()">
    <button class="btn ghost" id="idgo" onclick="idFind()" disabled>Continue</button>
    <div class="alert warn" style="margin-top:16px;text-align:left">
      Use <b>your own</b> ID only. Every tool is recorded against this name, and the store keeper sees it when he hands the tool over.
    </div>

}
function idCheck(){ const v=($('myid').value||'').replace(/\D/g,''); $('myid').value=v; $('idgo').disabled = v.length<4; }
function idFind(){
  const v=($('myid').value||'').trim();

function confirmSelf(t){

      <div class="meta">ID ${esc(t[1])} &middot; ${esc(t[0])} — ${SEC_FULL[t[0]]||''}</div>
    </div>
    <div class="alert warn">If this is <b>not you</b>, go back. Taking tools under another technician's name is a serious mistake.</div>
    <button class="btn primary" onclick="acceptSelf('${t[1]}')">Yes, this is me</button>

}
function acceptSelf(id){
  const t=TECHS.find(x=>String(x[1])===String(id));

// Scan his own technician sticker. The QR holds his personal link, so we read ?t= from it.
function scanSelf(){
  setTitle('Scan your QR','Hold your own sticker to the camera');
  $('view').innerHTML=`
    <div class="alert info">Point the camera at <b>your own technician QR sticker</b>.</div>
    <div id="reader"></div>

// pull the technician id out of a scanned personal link (or a bare id)
function readTechId(txt){
  txt=(txt||'').trim();
  const m=txt.match(/[?&]t=([A-Za-z0-9]+)/);
  if(m) return m[1];
  if(/^[0-9]{4,12}$/.test(txt)) return txt;
  return null;
}

// GATE: show identity, camera on, must scan cabin QR
function techGate(){

function techToolList(){

  $('view').innerHTML=`

    <button class="btn ghost" onclick="scanTool()" style="margin-bottom:14px">▦ Scan tool QR</button>
    <div class="card" id="results" style="padding:6px 14px"></div>
    <button class="btn primary" onclick="techGate()" style="margin-top:14px">Done — leave</button>`;
  tsearch();
}
// ONE shared tool search, used by the technician list and the no-phone screen
function searchTools(text){
  const raw=String(text||'').trim().toLowerCase();
  const q=raw.replace(/[-\s]/g,'');            // "tl2" or "tl-2" both work
  if(!q) return TOOLS.slice();
  return TOOLS.filter(t=>{
    const id=t[T_ID].toLowerCase().replace(/[-\s]/g,'');       // tl001
    const idnum=t[T_ID].toLowerCase().replace(/[^0-9]/g,'');   // 001
    const part=(t[T_PART]||'').toLowerCase().replace(/[-\s]/g,'');
    const name=(t[T_NAME]||'').toLowerCase();
    const loc=(t[T_LOC]||'').toLowerCase();
    return id.includes(q)||idnum.includes(q.replace(/^tl/,''))||part.includes(q)||name.includes(raw)||loc.includes(raw);
  }).sort((a,b)=>a[T_ID].localeCompare(b[T_ID],undefined,{numeric:true}));
}
function tsearch(){
  const raw=($('q')?$('q').value:'').trim().toLowerCase();
  const q=raw.replace(/[-\s]/g,'');
  const box=$('results');
  let list;
  if(q){
    list=searchTools(raw);
  } else {
    list=TOOLS.slice(0,10);
  }
  if(!list.length){box.innerHTML='<div class="empty">No tool found for “'+esc(raw)+'”</div>';return;}
  box.innerHTML=list.map(t=>{
    const st=toolStatus(t[T_ID]);const m=st!=='IN'?openMove(t[T_ID]):null;
    const over=m&&isOverdue(m);
    let b='';
    if(st==='OUT')b=over?'<span class="badge out">Overdue</span>':'<span class="badge out">Out</span>';
    else if(st==='REQ')b='<span class="badge pend">Take · waiting</span>';
    else if(st==='PENDING')b='<span class="badge pend">Return · waiting</span>';

let PROF=null;
function rbytech(box){
  const map={};toolMoves().forEach(m=>{if(m.status!=='IN')map[m.tid]=m;});
  const byTech={};
  Object.values(map).forEach(m=>{(byTech[m.techId]=byTech[m.techId]||{tech:m.tech,sec:m.sec,out:0,pend:0,dmg:0,req:0}); if(m.status==='OUT')byTech[m.techId].out++; if(m.status==='REQ')byTech[m.techId].req++; if(m.status==='PENDING'){byTech[m.techId].pend++; if(m.cin&&m.cin!=='A')byTech[m.techId].dmg++;}});
  const list=Object.entries(byTech).sort((a,b)=>b[1].out+b[1].pend-(a[1].out+a[1].pend));
  if(!list.length){box.innerHTML=`<div class="empty"><div class="big">👤</div>No technician has tools out</div>`;return;}
  box.innerHTML=list.map(([id,d])=>{
    const total=d.out+d.pend;

/* ================= MONTHLY REPORT ================= */
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthKey(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthLabel(key){const [y,m]=key.split('-');return MONTH_NAMES[parseInt(m,10)-1]+' '+y;}
function last3Months(){
  const out=[];const n=new Date();
  for(let i=0;i<3;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);out.push(monthKey(d));}
  return out;
}
function monthData(key){
  const moves=toolMoves().filter(m=>m.out&&monthKey(m.out)===key);
  const entries=LOG.filter(m=>m.kind==='ENTRY'&&m.at&&monthKey(m.at)===key);
  const damaged=moves.filter(m=>m.cin&&m.cin!=='A'&&m.cin!=='D');
  const missing=moves.filter(m=>m.cin==='D');
  const stillOut=moves.filter(m=>m.status==='OUT');
  const overdue=stillOut.filter(m=>isOverdue(m));
  const returned=moves.filter(m=>m.status==='IN');
  const noPhone=moves.filter(m=>m.noPhone);
  const npBy={};
  noPhone.forEach(m=>{
    const k=m.techId||m.tech;
    npBy[k]=npBy[k]||{tech:m.tech,sec:m.sec,id:m.techId,times:0,tools:[]};
    npBy[k].times++; npBy[k].tools.push(m.tid);
  });
  const noPhoneRows=Object.values(npBy).sort((a,b)=>b.times-a.times);
  // per technician
  const byTech={};
  moves.forEach(m=>{
    const k=m.techId||m.tech;
    byTech[k]=byTech[k]||{tech:m.tech,sec:m.sec,taken:0,returned:0,damaged:0,missing:0,out:0};
    byTech[k].taken++;
    if(m.status==='IN')byTech[k].returned++;
    if(m.status==='OUT')byTech[k].out++;
    if(m.cin&&m.cin!=='A'&&m.cin!=='D')byTech[k].damaged++;
    if(m.cin==='D')byTech[k].missing++;
  });
  const techRows=Object.values(byTech).sort((a,b)=>b.taken-a.taken);
  // busiest tools
  const byTool={};
  moves.forEach(m=>{byTool[m.tid]=(byTool[m.tid]||0)+1;});
  const toolRows=Object.entries(byTool).sort((a,b)=>b[1]-a[1]).slice(0,10);
  // per section
  const bySec={};
  moves.forEach(m=>{bySec[m.sec]=(bySec[m.sec]||0)+1;});
  return {key,moves,entries,damaged,missing,stillOut,overdue,returned,noPhone,noPhoneRows,techRows,toolRows,bySec};
}
function reportPick(){
  curStoreView=reportPick;setTitle('Monthly report','Ready any day of the month');
  const keys=last3Months();const cur=monthKey(new Date());
  $('view').innerHTML=`<button class="back" onclick="dash()">‹ Dashboard</button>
    <div class="alert info">Reports stay ready at all times. Open this month to see the situation up to today, or open a past month.</div>
    ${keys.map(k=>{const d=monthData(k);const isNow=k===cur;
      return `<button class="rolebtn" onclick="reportView('${k}')" style="margin-bottom:12px">
        <span class="ic ${isNow?'store':'tech'}">${isNow?'●':'▤'}</span>

        <span class="d">${d.moves.length} tool movement${d.moves.length!==1?'s':''} · ${d.damaged.length} damaged · ${d.missing.length} missing</span></span>
        <span class="ar">›</span></button>`;}).join('')}
    <p class="muted center" style="margin-top:6px">Only the last three months are kept ready.</p>`;
}

  const listBlock=(title,rows,fn,emptyMsg)=>{

  html+=listBlock('Damaged tools',d.damaged,dmgRow,'No tool damaged this month');

      </div>`).join('')
    : '<div class="empty">Every technician used his own phone this month</div>';
  html+=`<p class="muted" style="margin:12px 0 0;line-height:1.5">These technicians were issued tools manually because they did not bring their phone.</p></div>`;
  html+=listBlock('Overdue now',d.overdue,m=>{const t=toolById(m.tid)||[m.tid,'',''];
    return `<div class="rec"><div class="hd"><span class="rid">${esc(m.tid)}</span><span class="rname">${esc(t[T_NAME]||'')}</span><span class="badge out">Overdue</span></div>

  html+=listBlock('By technician',d.techRows,r=>
    `<div class="rec"><div class="hd"><span class="rname">${esc(r.tech)}</span><span class="badge ${r.damaged||r.missing?'out':'instore'}">${r.taken} taken</span></div>
      <div class="sub">${esc(r.sec)} · returned ${r.returned} · still out ${r.out}${r.damaged?' · damaged '+r.damaged:''}${r.missing?' · missing '+r.missing:''}</div></div>`,
    'No technician activity');
  html+=listBlock('Most used tools',d.toolRows,([tid,n])=>{const t=toolById(tid)||[tid,'',''];
    return `<div class="rec"><div class="hd"><span class="rid">${esc(tid)}</span><span class="rname">${esc(t[T_NAME]||'')}</span><span class="badge set">${n}×</span></div></div>`;},
    'No tools taken');
  html+=`<button class="btn primary" onclick="downloadReport('${key}')">Download this month</button>
    <p class="muted center" style="margin-top:10px">Opens in Excel. One file per month.</p>`;
  $('view').innerHTML=html;
}
function csvCell(v){v=(v==null?'':String(v));return '"'+v.replace(/"/g,'""')+'"';}
function downloadReport(key){
  const d=monthData(key);const rows=[];
  const push=(...a)=>rows.push(a.map(csvCell).join(','));
  push('TOOL CONTROL — MONTHLY REPORT');
  push('Month',monthLabel(key));
  push('Generated',new Date().toLocaleString('en-GB'));
  push('');
  push('SUMMARY');
  push('Cabin visits',d.entries.length);
  push('Tools taken',d.moves.length);
  push('Returned and received',d.returned.length);
  push('Still out',d.stillOut.length);
  push('Overdue now',d.overdue.length);
  push('Damaged',d.damaged.length);
  push('Missing / lost',d.missing.length);
  push('Came without phone',d.noPhone.length);
  push('');
  push('DAMAGED TOOLS');
  push('Tool ID','Tool name','Grade','Technician','Section','Returned','Defect');
  d.damaged.forEach(m=>{const t=toolById(m.tid)||[m.tid,'',''];
    push(m.tid,t[T_NAME]||'',m.cin,m.tech,m.sec,fmtTime(m.ret||m.out),m.note||'');});
  push('');
  push('CAME WITHOUT PHONE');
  push('Technician','ID','Section','Times','Tools');
  d.noPhoneRows.forEach(r=>push(r.tech,r.id||'',r.sec||'',r.times,r.tools.join(' ')));
  push('');
  push('MISSING / LOST');
  push('Tool ID','Tool name','Technician','Section','Reported','Note');
  d.missing.forEach(m=>{const t=toolById(m.tid)||[m.tid,'',''];
    push(m.tid,t[T_NAME]||'',m.tech,m.sec,fmtTime(m.ret||m.out),m.note||'');});
  push('');
  push('OVERDUE NOW');
  push('Tool ID','Tool name','Technician','Section','Out since','Held');
  d.overdue.forEach(m=>{const t=toolById(m.tid)||[m.tid,'',''];
    push(m.tid,t[T_NAME]||'',m.tech,m.sec,fmtTime(m.out),ago(m.out));});
  push('');
  push('BY TECHNICIAN');
  push('Technician','Section','Taken','Returned','Still out','Damaged','Missing');
  d.techRows.forEach(r=>push(r.tech,r.sec,r.taken,r.returned,r.out,r.damaged,r.missing));
  push('');
  push('MOST USED TOOLS');
  push('Tool ID','Tool name','Times taken');
  d.toolRows.forEach(([tid,n])=>{const t=toolById(tid)||[tid,'',''];push(tid,t[T_NAME]||'',n);});
  push('');
  push('ALL MOVEMENTS');
  push('Tool ID','Tool name','Technician','Section','Out','In','Condition','Pieces','Note','Status');
  d.moves.forEach(m=>{const t=toolById(m.tid)||[m.tid,'',''];
    push(m.tid,t[T_NAME]||'',m.tech,m.sec,fmtTime(m.out),m.ret?fmtTime(m.ret):'',m.cin||'',m.items||'',m.note||'',m.status);});
  const csv='\ufeff'+rows.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Tool_Report_'+key+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  toast('Report downloaded');
}

  var intro=document.getElementById('intro');
  if(!intro)return;
  // only show the intro on the landing screen (not when a personal tech link is opened mid-session)
  // Only run the intro on browsers that can actually do it.
  // If anything is missing (basic WebView / HTML Viewer apps) we skip straight to the page.
  var canAnimate = !!(window.requestAnimationFrame && document.querySelector &&
                      Element.prototype.getBoundingClientRect && window.performance);
  if(!canAnimate){ if(intro.parentNode) intro.parentNode.removeChild(intro); return; }
  intro.style.display='block';
  var flyA=document.getElementById('flyA'),flyT=document.getElementById('flyT');
  var imgA=flyA.querySelector('img'),imgT=flyT.querySelector('img');
  var shA=document.getElementById('shA'),shT=document.getElementById('shT');
  var headA=document.getElementById('hLogoA'),headT=document.getElementById('hLogoT');
  var ARA=1, ART=554/90, bigA=124, bigT=54, settled=false;
  function vw(){return window.innerWidth;} function vh(){return window.innerHeight;}
  function place(){
    var cx=vw()/2, cy=vh()*0.45, gap=26;
    var aw=bigA*ARA, ah=bigA, tw=bigT*ART, th=bigT;
    var total=ah+gap+th, topA=cy-total/2;
    flyA.style.width=aw+'px';flyA.style.height=ah+'px';flyA.style.left=(cx-aw/2)+'px';flyA.style.top=topA+'px';
    flyT.style.width=tw+'px';flyT.style.height=th+'px';flyT.style.left=(cx-tw/2)+'px';flyT.style.top=(topA+ah+gap)+'px';
  }
  place();
  window.addEventListener('resize',function(){if(!settled)place();});
  [imgA,imgT].forEach(function(im){im.style.filter='brightness(.25) saturate(.4)';im.style.transform='translateY(24px)';im.style.opacity='0';});
  var DUR=4000,t0=0;
  function anim(now){
    var p=Math.min((now-t0)/DUR,1);
    var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    var br=0.25+e*1.15, sa=0.4+e*0.6;
    [imgA,imgT].forEach(function(im){
      im.style.opacity=Math.min(1,e*1.5);
      im.style.transform='translateY('+(24-24*e)+'px)';
      im.style.filter='brightness('+br+') saturate('+sa+') drop-shadow(0 0 '+(20*e)+'px rgba(255,150,60,'+(0.5*e)+'))';
    });
    var pos=180-((now-t0)*0.08)%320;
    shA.style.backgroundPosition=pos+'% 0';shT.style.backgroundPosition=pos+'% 0';
    if(p<1)requestAnimationFrame(anim);
    else{
      [imgA,imgT].forEach(function(im){im.style.transition='filter .6s';im.style.filter='brightness(1) saturate(1) drop-shadow(0 0 22px rgba(255,180,90,.5))';});
      shA.style.transition='opacity .45s';shT.style.transition='opacity .45s';shA.style.opacity='0';shT.style.opacity='0';
      setTimeout(flyToHeader,620);
    }
  }
  function flyToHeader(){
    if(settled)return;settled=true;
    // make sure the header images are really laid out before measuring (iOS decodes late)
    var tries=0;
    (function measure(){
      var ra=headA.getBoundingClientRect(), rt=headT.getBoundingClientRect();
      var ok=ra.width>4&&ra.height>4&&rt.width>4&&rt.height>4;
      if(!ok&&tries<30){tries++;return setTimeout(measure,50);}
      if(!ok){return finish();}          // never leave logos stranded
      var snap=document.getElementById('snap');
      if(snap){
        snap.style.width='320px';snap.style.height='320px';
        snap.style.left=(vw()/2)+'px';snap.style.top=(vh()*0.45)+'px';
        snap.style.transform='translate(-50%,-50%)';
        snap.style.animation='snapflash .7s ease forwards';
      }
      headA.style.visibility='hidden';headT.style.visibility='hidden';
      var E='cubic-bezier(.45,0,.25,1)', T='.9s';
      function go(f,r){
        f.style.transition='left '+T+' '+E+', top '+T+' '+E+', width '+T+' '+E+', height '+T+' '+E;
        f.style.left=r.left+'px';f.style.top=r.top+'px';f.style.width=r.width+'px';f.style.height=r.height+'px';
      }
      go(flyA,ra);go(flyT,rt);
      setTimeout(finish,950);
    })();
  }
  function finish(){
    headA.style.visibility='visible';headT.style.visibility='visible';
    if(flyA&&flyA.parentNode)flyA.remove();
    if(flyT&&flyT.parentNode)flyT.remove();
    if(intro)intro.style.display='none';
  }
  window.skipIntro=function(){settled=true;finish();};
  // tap anywhere to skip
  intro.addEventListener('click',function(){window.skipIntro();});
  // hard safety: whatever happens, the intro is gone by 9s
  setTimeout(function(){if(intro&&intro.style.display!=='none'){settled=true;finish();}},9000);
  // if images fail to load at all, don't show a black screen
  var loaded=0;
  [imgA,imgT].forEach(function(im){
    if(im.complete&&im.naturalWidth>0){loaded++;}
    else{im.addEventListener('error',function(){settled=true;finish();});}
  });
  setTimeout(function(){var k=document.getElementById('introskip');if(k)k.classList.add('show');},700);
  function ready(cb){
    var need=2,done=0;
    function one(){if(++done>=need)cb();}
    [imgA,imgT].forEach(function(im){
      if(im.complete&&im.naturalWidth>0)one();
      else{im.addEventListener('load',one);im.addEventListener('error',one);}
    });
    setTimeout(cb,1500); // never wait forever
  }
  var started=false;
  ready(function(){if(started)return;started=true;t0=performance.now();requestAnimationFrame(anim);});
  }catch(e){
    // any failure at all -> remove the intro, show the real page
    try{
      var i=document.getElementById('intro'); if(i&&i.parentNode)i.parentNode.removeChild(i);
      var a=document.getElementById('hLogoA'), t=document.getElementById('hLogoT');
      if(a)a.style.visibility='visible'; if(t)t.style.visibility='visible';
    }catch(e2){}
  }
})();

</script>
